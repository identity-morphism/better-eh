version: 2
updates:
  - package-ecosystem: bun
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-toolchain:
        patterns:
          - "*"
    ignore:
      # The canary pin is load-bearing: stable Bun has no `lint` subcommand, so `bun lint`
      # resolves back to the `lint` package script, recurses, and exits 0 without linting
      # anything. See prek.toml and docs/DEVELOPMENT.md.
      - dependency-name: bun
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
