name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # --generate-notes needs the previous tag.
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Release tags point at master
        run: |
          tag="$(git describe --tags --exact-match)"
          case "$tag" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "not a release tag: $tag"; exit 1 ;;
          esac
          git fetch --no-tags origin master
          git merge-base --is-ancestor HEAD origin/master
      - run: bun run build
      - name: Tag, package.json and committed dist agree
        run: |
          tag="$(git describe --tags --exact-match)"
          version="$(bun -p 'require("./package.json").version')"
          test "v$version" = "$tag"
          grep -Eq "^// @version[[:space:]]+$version$" dist/better-eh.user.js
          git diff --exit-code dist/
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$(git describe --tags --exact-match)"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/better-eh.user.js --clobber
          else
            gh release create "$tag" dist/better-eh.user.js \
              --verify-tag --generate-notes --title "Better EH $tag"
          fi
