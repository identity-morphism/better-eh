name: Live parser canary

on:
  schedule:
    # Mondays at 06:17 UTC, after both tag-data refreshes.
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: live-parsers
  cancel-in-progress: false

jobs:
  parse:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Parse the live pages
        id: live
        continue-on-error: true
        run: bun run check:live
      - name: Close the stale issue when the check recovers
        if: steps.live.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          number="$(gh issue list --state open --search 'Live parser canary failed in:title' --json number --jq '.[0].number // empty')"
          if [ -n "$number" ]; then
            gh issue close "$number" --comment "The scheduled live parser canary passes again."
          fi
      - name: Open or update the issue on failure
        if: steps.live.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Live parser canary failed"
          body="The weekly live-site parser check failed. Inspect the run: $RUN_URL"
          number="$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // empty')"
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$title" --body "$body" --label bug
          fi
          exit 1
