name: Update tag vocabulary

on:
  schedule:
    # Mondays at 05:47 UTC. The upstream dataset publishes daily; weekly is enough for suggestions.
    - cron: "47 5 * * 1"
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - assets/tag-index.bin
      - src/tags/core-vocabulary.ts
      - .github/workflows/update-tag-index.yml

permissions:
  contents: write
  # `gh workflow run ci.yml` dispatches the check that branch protection then requires.
  actions: write

concurrency:
  group: update-tag-index
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: false
      - run: git checkout -B master origin/master
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run update:tag-index
      - run: bun run update:core-vocabulary
      - name: Detect vocabulary change
        id: asset
        run: |
          if [ -z "$(git status --porcelain -- assets/tag-index.bin src/tags/core-vocabulary.ts)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.asset.outputs.changed == 'true'
        run: bun run check
      - if: steps.asset.outputs.changed == 'true'
        run: bun run test
      - if: steps.asset.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bun run publish:tag-index
