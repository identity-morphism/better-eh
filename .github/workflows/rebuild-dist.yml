name: Rebuild dist

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to rebuild and push, e.g. a dependabot branch
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: rebuild-dist-${{ inputs.branch }}
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Commit and push the rebuilt bundle
        env:
          BRANCH: ${{ inputs.branch }}
        run: |
          case "$BRANCH" in
            master|main)
              echo "refusing to rebuild a protected release branch; use a release instead"
              exit 1
              ;;
          esac
          if git diff --quiet -- dist/better-eh.user.js; then
            echo "dist is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/better-eh.user.js
          git commit -m "chore: rebuild dist"
          git push origin "HEAD:refs/heads/$BRANCH"
