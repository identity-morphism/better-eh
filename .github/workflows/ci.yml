name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run check:generated
      - run: bun run format:check
      - run: bun run lint
      - run: bun run typecheck
      - name: Tests with the src/ coverage floor
        run: bun run test:coverage
      - run: bun run build
      - run: bun run check:size
      - run: git diff --exit-code dist/
      - name: Pull requests leave the release version alone
        # Releases own the number: `bun run release` bumps it after the pull request merges.
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bun run check:pr-version "$BASE_SHA"
      - name: A version only exists with its release tag
        # `bun run release` bumps, builds, commits and tags in one atomic push. A hand-committed
        # version bump leaves master advertising a release that does not exist.
        run: bun run check:release-tag
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:browser
      - uses: actions/upload-artifact@v7
        with:
          name: better-eh.user.js
          path: dist/better-eh.user.js
